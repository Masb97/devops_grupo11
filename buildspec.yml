version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - python --version
      - python -m pip install -r requirements-dev.txt
  build:
    commands:
      - rm -rf ci-artifact
      - python -m pytest
      - mkdir -p ci-artifact/.ebextensions
      - cp application.py config.py extensions.py instancia.py models.py resources.py schemas.py requirements.txt Procfile VERSION ci-artifact/
      - cp .ebextensions/*.config ci-artifact/.ebextensions/
      - printf '%s\n' "$CODEBUILD_RESOLVED_SOURCE_VERSION" > ci-artifact/CI_COMMIT.txt

artifacts:
  base-directory: ci-artifact
  files:
    - "**/*"
    - ".ebextensions/**/*"
