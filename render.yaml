services:
  - type: web
    name: devops-proyecto
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi init-db
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devops-proyecto-db
          property: connectionString
databases:
  - name: devops-proyecto-db
    databaseName: devops_proyecto
    user: devops_user
    ipAllowList: []
